[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vdownloader-pytube"
version = "0.2.0"
description = "Aplicação web moderna para extração e download de vídeos e áudios do YouTube."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Uadson", email = "uadson@example.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "yt-dlp>=2024.3.10",
    "pytube>=12.1.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["vdownloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
