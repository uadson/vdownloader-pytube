# fly.toml app configuration file generated for vdtube on 2026-10-22T13:39:40-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vdtube'
primary_region = 'gru'

[build]
  dockerfile = 'infra/docker/Dockerfile'

[env]
  APP_ENV = 'production'
  PORT = '8088'
  PYTHONUNBUFFERED = '1'

[http_service]
  internal_port = 8088
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 30

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
